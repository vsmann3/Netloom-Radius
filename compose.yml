name: ${COMPOSE_PROJECT_NAME:-netloom-radius}

x-app: &app
  image: ${APP_IMAGE:-netloom-app:lab}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:?Load image-lock.env}
  environment:
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    DB_PASSWORD_FILE: /run/secrets/db_password
    DB_HOST: db
    DB_NAME: netloom
    DB_USER: netloom_app
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-true}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
    CAF_CATALOG_ENABLED: ${CAF_CATALOG_ENABLED:-false}
    CAF_CATALOG_PROXY_IPS: ${CAF_CATALOG_PROXY_IPS:-}
  secrets:
    - django_secret_key
    - db_password
  networks: [backend]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]

services:
  db:
    image: ${MARIADB_IMAGE:?Load image-lock.env}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: netloom
      MARIADB_USER: netloom_app
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_ROOT_HOST: localhost
    secrets: [db_password, db_root_password, db_migration_password, db_radius_password]
    volumes:
      - db_data:/var/lib/mysql
      - ./deploy/db/10-service-users.sh:/docker-entrypoint-initdb.d/10-service-users.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # Deliberately no host database port.

  migrate:
    <<: *app
    environment:
      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
      DB_PASSWORD_FILE: /run/secrets/db_migration_password
      DB_HOST: db
      DB_NAME: netloom
      DB_USER: netloom_migrate
    secrets: [django_secret_key, db_migration_password]
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    networks: [backend, frontend]
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  radius:
    profiles: [radius]
    image: ${FREERADIUS_IMAGE:?Load image-lock.env}
    entrypoint: [/bin/sh, /opt/netloom/start.sh]
    command: []
    volumes:
      - ./deploy/radius/clients.conf:/etc/raddb/clients.conf:ro
      - ./deploy/radius/sites-enabled:/etc/raddb/sites-enabled:ro
      - ./deploy/radius/mods-enabled:/etc/raddb/mods-enabled:ro
      - ./deploy/radius/start.sh:/opt/netloom/start.sh:ro
    networks: [backend]
    secrets: [radius_clients, db_radius_password]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No published UDP ports until the disposable packet tests pass on the VM.

networks:
  frontend: {}
  backend:
    internal: true
volumes:
  db_data:
secrets:
  django_secret_key:
    file: ./secrets/django_secret_key
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password
  radius_clients:
    file: ./secrets/radius_clients
  db_migration_password:
    file: ./secrets/db_migration_password
  db_radius_password:
    file: ./secrets/db_radius_password
