server {
    listen 80;
    listen [::]:80;
    server_name radius.netnoc.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/netloom-acme;
    }
    location / { return 301 https://radius.netnoc.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name radius.netnoc.in;
    ssl_certificate /etc/letsencrypt/live/radius.netnoc.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radius.netnoc.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NetloomTLS:10m;
    client_max_body_size 64k;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host radius.netnoc.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
