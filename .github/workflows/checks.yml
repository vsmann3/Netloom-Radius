name: Checks

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    name: Promotion policy
    runs-on: ubuntu-24.04
    steps:
      - name: Require production pull requests to come from staging
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_BRANCH" = staging
          test "$HEAD_REPOSITORY" = "$REPOSITORY"

  application:
    name: Application checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check --settings=netloom.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=netloom.test_settings
      - run: python manage.py test core --settings=netloom.test_settings -v 2
      - name: Check host scripts
        run: |
          for script in scripts/*.sh deploy/db/*.sh deploy/radius/*.sh; do
            sh -n "$script"
          done

  radius-integration:
    name: MariaDB and FreeRADIUS integration
    needs: application
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exercise upstream SQL and PAP with disposable synthetic data
        run: python3 scripts/test_radius.py
